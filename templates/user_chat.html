<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人工核验对话</title>
    <style>
        body{max-width:900px;margin:20px auto;padding:0 15px;font-family:Microsoft Yahei;}
        .origin-info{background:#eef4ff;padding:14px;border-radius:8px;margin-bottom:20px;border:1px solid #c8d8f7;}
        .chat-box{border:1px solid #ccc;padding:15px;height:450px;overflow-y:auto;border-radius:8px;margin-bottom:12px;}
        .msg-user{background:#d8ecff;padding:8px 12px;margin:6px 0;border-radius:6px;max-width:70%;margin-left:auto;}
        .msg-admin{background:#eeeeee;padding:8px 12px;margin:6px 0;border-radius:6px;max-width:70%;margin-right:auto;}
        textarea{width:100%;height:80px;padding:10px;box-sizing:border-box;}
        button{padding:8px 20px;margin-top:8px;cursor:pointer;}
    </style>
</head>
<body>
<h2>人工反诈核验咨询会话</h2>
<div class="origin-info">
    <h4>本次自动核验提交内容：</h4>
    <p><b>核验类型：</b>{{session_data[2]}}</p>
    <p><b>原始输入：</b>{{session_data[3]}}</p>
    {% if session_data[4] %}
    <p><b>媒体识别文本：</b>{{session_data[4]}}</p>
    {% endif %}
    <p><b>AI事实核验：</b>{{session_data[5]}}</p>
    {% if session_data[6] %}
    <p><b>AI心理纠偏：</b>{{session_data[6]}}</p>
    {% endif %}
</div>

<div class="chat-box" id="chatBox"></div>
<textarea id="userInput" placeholder="输入你的问题发送给人工客服"></textarea>
<br>
<button onclick="sendUserMsg()">发送消息</button>
<br><br>
<a href="/">← 返回首页</a>

<script>
const sid = {{ session_id | int }};
let timer;

async function loadMessages(){
    const res = await fetch(`/api/get_chat_msg?session_id=${sid}`);
    const d = await res.json();
    const box = document.getElementById("chatBox");
    box.innerHTML = "";
    d.messages.forEach(item=>{
        const div = document.createElement("div");
        if(item[0]==="user"){
            div.className="msg-user";
            div.innerText="你："+item[1];
        }else{
            div.className="msg-admin";
            div.innerText="客服："+item[1];
        }
        box.appendChild(div);
    })
    box.scrollTop = box.scrollHeight;
}

async function sendUserMsg(){
    const text = document.getElementById("userInput").value.trim();
    if(!text)return;
    const fd=new FormData();
    fd.append("session_id",sid);
    fd.append("content",text);
    await fetch("/api/user_send_msg",{method:"POST",body:fd});
    document.getElementById("userInput").value="";
    loadMessages();
}

window.onload=()=>{
    loadMessages();
    timer = setInterval(loadMessages,1800);
}
window.onbeforeunload=()=>{clearInterval(timer);}
</script>
</body>
</html>
